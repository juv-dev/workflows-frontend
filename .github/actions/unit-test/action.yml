name: 'Unit Test'
description: 'Runs the unit tests with coverage and posts a summary comment to the PR'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '11.1.2'
  coverage-path:
    description: 'Path to coverage output'
    required: false
    default: 'coverage/'
  github-token:
    description: 'GitHub token used to post the coverage comment'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        run_install: false

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run tests with coverage
      shell: bash
      run: pnpm run test:coverage

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ inputs.coverage-path }}
        retention-days: 7

    - name: Coverage summary comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let body = '## Test Results\n\n';
          try {
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            body += '| Metric | Coverage |\n|--------|----------|\n';
            body += `| Lines | ${t.lines.pct}% |\n`;
            body += `| Functions | ${t.functions.pct}% |\n`;
            body += `| Branches | ${t.branches.pct}% |\n`;
            body += `| Statements | ${t.statements.pct}% |\n`;
            body += `\nThreshold: **80%** on all metrics`;
          } catch {
            body += 'Coverage summary not available.';
          }
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body?.startsWith('## Test Results'));
          if (existing) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }
