name: 'Unit Test'
description: 'Runs the unit tests with coverage and posts a summary comment to the PR'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '11.1.2'
  coverage-path:
    description: 'Path to coverage output'
    required: false
    default: 'coverage/'
  coverage-threshold:
    description: 'Minimum required coverage percentage on all metrics'
    required: false
    default: '80'
  github-token:
    description: 'GitHub token used to post the coverage comment'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        run_install: false

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run tests with coverage
      shell: bash
      run: pnpm run test:coverage

    - name: Enforce coverage threshold
      shell: bash
      env:
        THRESHOLD: ${{ inputs.coverage-threshold }}
      run: |
        node -e '
          const fs = require("fs");
          const threshold = Number(process.env.THRESHOLD);
          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
          const t = summary.total;
          const metrics = ["lines", "functions", "branches", "statements"];
          const failed = metrics.filter((m) => t[m].pct < threshold);
          if (failed.length > 0) {
            for (const m of failed) {
              console.error(`::error::Coverage for ${m} is ${t[m].pct}%, below the required ${threshold}%`);
            }
            process.exit(1);
          }
          console.log(`Coverage OK: all metrics >= ${threshold}%`);
        '

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: ${{ inputs.coverage-path }}
        retention-days: 7

    - name: Coverage summary comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let body = '## Test Results\n\n';
          try {
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            body += '| Metric | Coverage |\n|--------|----------|\n';
            body += `| Lines | ${t.lines.pct}% |\n`;
            body += `| Functions | ${t.functions.pct}% |\n`;
            body += `| Branches | ${t.branches.pct}% |\n`;
            body += `| Statements | ${t.statements.pct}% |\n`;
            body += `\nThreshold: **80%** on all metrics`;
          } catch {
            body += 'Coverage summary not available.';
          }
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body?.startsWith('## Test Results'));
          if (existing) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }
