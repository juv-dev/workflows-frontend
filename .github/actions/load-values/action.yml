name: 'Load Values'
description: 'Installs deps and exposes package.json values as outputs'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '11.1.2'

outputs:
  version:
    description: 'Project version from package.json'
    value: ${{ steps.values.outputs.version }}
  name:
    description: 'Project name from package.json'
    value: ${{ steps.values.outputs.name }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        run_install: false

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Load project values
      id: values
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        NAME=$(node -p "require('./package.json').name")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "Project: $NAME v$VERSION"
