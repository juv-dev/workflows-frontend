name: 'Code Quality'
description: 'Quality checks: duplicated code, unused dependencies and type coverage — runs sequentially, fails fast'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '11.1.2'
  jscpd-threshold:
    description: 'Max allowed percentage of duplicated code'
    required: false
    default: '5'
  type-coverage-min:
    description: 'Minimum percentage of typed code required'
    required: false
    default: '95'
  type-coverage-version:
    description: 'Exact type-coverage version to run (pinned separately from the project TypeScript version)'
    required: false
    default: '2.30.1'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        run_install: false

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Detect duplicated code
      shell: bash
      run: |
        npx jscpd src/ \
          --threshold ${{ inputs.jscpd-threshold }} \
          --min-tokens 50 \
          --reporters consoleFull \
          --ignore "**/*.spec.ts,**/*.test.ts"

    - name: Detect unused deps and exports
      shell: bash
      run: npx knip --no-progress

    - name: Check type coverage
      shell: bash
      env:
        TYPE_COVERAGE_VERSION: ${{ inputs.type-coverage-version }}
      run: |
        TS_VERSION=$(node -p "require('./package.json').devDependencies?.typescript || require('./package.json').dependencies?.typescript" | sed -E 's/^[~^]//')
        if [ -z "$TS_VERSION" ] || [ "$TS_VERSION" = "undefined" ]; then
          echo "::error::No typescript dependency found in package.json; type-coverage requires one."
          exit 1
        fi
        echo "Installing type-coverage@$TYPE_COVERAGE_VERSION pinned to typescript@$TS_VERSION (not the npm 'latest' tag)"
        TOOL_DIR=$(mktemp -d)
        (cd "$TOOL_DIR" && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund --save-exact "typescript@$TS_VERSION" "type-coverage@$TYPE_COVERAGE_VERSION" >/dev/null 2>&1)
        bash "$TOOL_DIR/node_modules/.bin/type-coverage" --at-least ${{ inputs.type-coverage-min }} --strict
