name: Workflow PR Unit Tests

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      coverage-path:
        type: string
        default: 'coverage/'
      coverage-threshold:
        type: string
        default: '80'

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Enforce coverage threshold
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          node -e '
            const fs = require("fs");
            const threshold = Number(process.env.THRESHOLD);
            const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const t = summary.total;
            const metrics = ["lines", "functions", "branches", "statements"];
            const failed = metrics.filter((m) => t[m].pct < threshold);
            if (failed.length > 0) {
              for (const m of failed) {
                console.error(`::error::Coverage for ${m} is ${t[m].pct}%, below the required ${threshold}%`);
              }
              process.exit(1);
            }
            console.log(`Coverage OK: all metrics >= ${threshold}%`);
          '

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage-path }}
          retention-days: 7

      - name: Coverage summary comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Test Results\n\n';
            try {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const t = summary.total;
              body += '| Metric | Coverage |\n|--------|----------|\n';
              body += `| Lines | ${t.lines.pct}% |\n`;
              body += `| Functions | ${t.functions.pct}% |\n`;
              body += `| Branches | ${t.branches.pct}% |\n`;
              body += `| Statements | ${t.statements.pct}% |\n`;
              body += `\nThreshold: **80%** on all metrics`;
            } catch {
              body += 'Coverage summary not available.';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith('## Test Results'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
