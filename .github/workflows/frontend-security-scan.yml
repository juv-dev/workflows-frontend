name: Workflow Security Scan

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      pnpm-version:
        type: string
        default: '11.1.2'
      jscpd-threshold:
        type: string
        default: '5'
      type-coverage-min:
        type: string
        default: '95'
      allowed-licenses:
        type: string
        default: 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC-BY-4.0;CC0-1.0;Unlicense;0BSD;Python-2.0;BlueOak-1.0.0'

permissions:
  contents: read

jobs:
  bearer:
    name: Bearer SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run Bearer
        uses: bearer/bearer-action@v2
        with:
          scanner: sast
          severity: critical,high
          diff: ${{ github.event_name == 'pull_request' }}

  supply-chain:
    name: Supply Chain Hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Run pnpm audit
        run: pnpm audit --audit-level high

      - name: Verify .npmrc has no committed credentials
        run: |
          if [ -f .npmrc ]; then
            if grep -E '_authToken=|_password=' .npmrc > /dev/null; then
              echo "::error file=.npmrc::.npmrc contains credentials. Move tokens to ~/.npmrc or use CI secrets."
              exit 1
            fi
            echo ".npmrc OK — no committed credentials."
          else
            echo "No .npmrc found — OK."
          fi

      - name: Verify pnpm-workspace.yaml hardening flags
        run: |
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "::warning::No pnpm-workspace.yaml found. Cannot enforce hardening flags."
            exit 0
          fi

          fail=0

          age=$(grep -E '^[[:space:]]*minimumReleaseAge[[:space:]]*:' pnpm-workspace.yaml | head -1 | awk -F: '{gsub(/[[:space:]]/,"",$2); print $2}')
          if [ -z "$age" ] || [ "$age" -lt 4320 ]; then
            echo "::error file=pnpm-workspace.yaml::minimumReleaseAge must be >= 4320 (3 days cooldown). Found: '${age:-missing}'"
            fail=1
          fi

          if ! grep -E '^[[:space:]]*blockExoticSubdeps[[:space:]]*:[[:space:]]*true' pnpm-workspace.yaml > /dev/null; then
            echo "::error file=pnpm-workspace.yaml::blockExoticSubdeps must be set to true."
            fail=1
          fi

          if ! grep -E '^[[:space:]]*strictDepBuilds[[:space:]]*:[[:space:]]*true' pnpm-workspace.yaml > /dev/null; then
            echo "::error file=pnpm-workspace.yaml::strictDepBuilds must be set to true."
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "pnpm-workspace.yaml hardening OK."

  vulnerabilities:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml
            --recursive
            ./

  secrets:
    name: Secret Scanning
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  licenses:
    name: License Compliance
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check allowed licenses
        run: |
          npx license-checker \
            --production \
            --onlyAllow "${{ inputs.allowed-licenses }}" \
            --excludePrivatePackages \
            --summary

  duplicates:
    name: Code Duplication
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Detect duplicated code
        run: |
          npx jscpd src/ \
            --threshold ${{ inputs.jscpd-threshold }} \
            --min-tokens 50 \
            --reporters consoleFull \
            --ignore "**/*.spec.ts,**/*.test.ts"

  unused:
    name: Unused Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect unused deps and exports
        run: npx knip --no-progress

  type-coverage:
    name: Type Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check type coverage
        run: npx type-coverage --at-least ${{ inputs.type-coverage-min }} --strict
